[package]
name = "electricity-tariff-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["full"] }
map-macro = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
num-traits = "0.2.19"
zip = "9.0.0"
csv = "1.4.0"
postcard = { version = "1.1.3", features = ["alloc"] }
directories = "6.0.0"
ordered-float = { version = "5.5.0", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["blocking", "form", "cookies", "json", "rustls"] }
rusty_xml = "0.8.3"
regex = "1.13.1"
